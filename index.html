<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Web Museo - Realistic Lighting</title>
    <style>
      /* --- Loading Screen --- */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1a1a1a;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }

      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .loading-mascot {
        width: 250px;
        height: auto;
        border-radius: 20px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      .progress-bar-container {
        width: 300px;
        height: 20px;
        background-color: #333;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 15px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        border: 2px solid #444;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
        border-radius: 10px;
        transition: width 0.2s ease;
      }

      #loading-text {
        font-family: 'Inter', sans-serif;
        margin: 0;
        font-weight: 600;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <!-- Capybara Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <img src="/capybara_loading.png" alt="Capybara Loading" class="loading-mascot" />
        <h2 id="loading-text">Cargando Museo... 0%</h2>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- UI Container for testing Sidebar -->
    <div id="ui-container">
      <button id="open-sidebar-btn" class="open-sidebar-btn">☰ Menú</button>
      
      <!-- Global Progress Bar -->
      <div id="global-progress-container" class="global-progress-container">
        <div id="global-progress-text">Progreso: 0 / 5 completados</div>
        <div class="global-progress-bar-bg">
          <div id="global-progress-bar-fill"></div>
        </div>
      </div>

      <aside id="sidebar">
        <div class="sidebar-header">
          <h2>Workshops</h2>
          <button id="close-sidebar-btn" class="close-sidebar-btn">✕</button>
        </div>
        <ul class="sidebar-menu">
          <li><button data-target="cultural-diversity">01 Cultural Diversity</button></li>
          <li><button data-target="roots-faces">02 Roots & Faces</button></li>
          <li><button data-target="muisca-raft">03 Muisca Raft</button></li>
        </ul>
      </aside>
      <main id="content-area" class="hidden">
        <div class="content-panel">
          <button id="close-content">Cerrar Componente</button>
          <div id="component-root"></div>
        </div>
      </main>
    </div>

    <!-- Container for specific object interaction UI (like Muisca Raft) -->
    <div id="object-ui-container" class="hidden">
      <!-- Content injected by ui.js -->
    </div>

    <div id="joystick-zone" class="hidden"></div>
    <div id="center-camera-btn" class="hidden" title="Centrar cámara (C)">
      🎯
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
